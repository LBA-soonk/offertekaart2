<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Offertekaart met BAG en bufferselectie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <style>
    #map { height: 90vh; width: 100%; }
    .controls {
      text-align: center;
      margin: 10px;
    }
  </style>
</head>
<body>
  <div class="controls">
    Straal (meter):
    <input type="number" id="straal" value="25" min="1" style="width:80px;">
    <button onclick="downloadMap()">Download kaart</button>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <script>
    const map = L.map('map').setView([52.1, 5.1], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'OpenStreetMap contributors'
    }).addTo(map);

    const gebouwen = [];
    const gebouwLayerGroup = L.geoJSON(null, {
      style: () => ({ color: 'black', fillColor: 'grey', fillOpacity: 0.3 }),
      onEachFeature: (feature, layer) => {
        layer.isSelected = false;
        layer.on('click', e => {
          if (e.originalEvent.ctrlKey) {
            layer.isSelected = !layer.isSelected;
            layer.setStyle({
              color: layer.isSelected ? 'green' : 'black',
              fillColor: layer.isSelected ? 'green' : 'grey',
              fillOpacity: layer.isSelected ? 0.6 : 0.3
            });
          }
        });
        gebouwen.push(layer);
      }
    }).addTo(map);

    function resetStijlen() {
      gebouwen.forEach(g => {
        g.isSelected = false;
        g.setStyle({ color: 'black', fillColor: 'grey', fillOpacity: 0.3 });
      });
    }

    function selecteerGebouwenBinnenBuffer(bufferGeoJSON) {
      gebouwen.forEach(g => {
        let gebouwGeoJSON = g.toGeoJSON();
        if (gebouwGeoJSON.geometry.type === "Polygon") {
          gebouwGeoJSON = turf.multiPolygon([gebouwGeoJSON.geometry.coordinates]);
        }
        const intersects = turf.booleanIntersects(bufferGeoJSON, gebouwGeoJSON);
        if (intersects) {
          g.isSelected = true;
          g.setStyle({ color: 'green', fillColor: 'green', fillOpacity: 0.6 });
        }
      });
    }

    async function laadBAGGebouwen(bbox) {
      const origineleUrl = `https://geodata.nationaalgeoregister.nl/bag/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=bag:pand&outputFormat=application/json&srsName=EPSG:4326&bbox=${bbox.join(',')},EPSG:4326`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(origineleUrl)}`;
      console.log('Opvragen BAG via proxy URL:', proxyUrl);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('HTTP-fout bij ophalen BAG-data: ' + response.status);
        const data = await response.json();
        console.log('Gebouwen geladen:', data);
        gebouwLayerGroup.clearLayers();
        gebouwen.length = 0;
        gebouwLayerGroup.addData(data);
      } catch (error) {
        console.error('Fout bij ophalen BAG-gegevens:', error);
        alert('Er ging iets mis bij het ophalen van de BAG-gegevens. Zie de console voor details.');
      }
    }

    const drawnItems = new L.FeatureGroup().addTo(map);
    const drawControl = new L.Control.Draw({
      draw: {
        polygon: true,
        polyline: true,
        rectangle: false,
        circle: false,
        marker: false,
        circlemarker: false
      },
      edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, async e => {
      const layer = e.layer;
      drawnItems.clearLayers();
      drawnItems.addLayer(layer);
      resetStijlen();
      const straal = parseFloat(document.getElementById('straal').value);
      const geojson = layer.toGeoJSON();
      const buffered = turf.buffer(geojson, straal, { units: 'meters' });
      const bounds = turf.bbox(buffered);
      await laadBAGGebouwen(bounds);
      selecteerGebouwenBinnenBuffer(buffered);
    });

    function downloadMap() {
      domtoimage.toPng(document.getElementById('map')).then(dataUrl => {
        const link = document.createElement('a');
        link.download = 'offertekaart.png';
        link.href = dataUrl;
        link.click();
      });
    }
  </script>
</body>
</html>
